<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小口金融 顧客管理システム</title>
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <header class="globalnav">
    <div class="gn-inner">
      <span class="gn-brand">小口金融</span>
      <div class="gn-links">
        <button class="gn-link" data-act="shop-edit" title="手持ち資金・凄み・警察の目を直す">店の数字</button>
        <button class="gn-link" data-act="period-open" title="期間（最終日）と目標の純利を変える">期間・目標</button>
        <button class="gn-link" data-act="reset" title="台帳を読み直して1日目からやり直す">最初から</button>
      </div>
    </div>
  </header>

  <nav class="localnav" aria-label="画面の切り替え">
    <div class="ln-inner">
      <span class="ln-title">顧客管理システム</span>
      <div class="tabs" id="tabs"></div>
      <div class="ln-actions">
        <button class="ln-link" id="skip" data-act="skip">早送り<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg></button>
        <button class="primary pill" id="end" data-act="end">1日を終える<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
      </div>
    </div>
  </nav>

  <section class="hero" aria-label="今日の数字">
    <div class="hero-inner">
      <p class="eyebrow" id="period-label"></p>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-sub" id="hint"></p>
      <dl class="kpis" id="kpis"></dl>
    </div>
  </section>

  <div class="page">
    <main class="view" id="view"></main>
  </div>

  <div class="scrim" id="scrim" data-act="close-drawer" hidden></div>
  <aside class="drawer" id="drawer" tabindex="-1" aria-label="詳細" hidden></aside>


  <div class="overlay" id="result" hidden>
    <div class="sheet" id="result-body"></div>
  </div>

  <div class="overlay" id="alloc" hidden>
    <div class="sheet" id="alloc-body" role="dialog" aria-modal="true" aria-label="不明入金を充当する"></div>
  </div>

  <div class="overlay" id="period" hidden>
    <div class="sheet" id="period-body" role="dialog" aria-modal="true" aria-label="期間・目標"></div>
  </div>

  <div class="overlay" id="reset" hidden>
    <div class="sheet" id="reset-body" role="dialog" aria-modal="true" aria-label="最初から"></div>
  </div>

  <div class="overlay" id="editor" hidden>
    <div class="sheet" id="editor-body" role="dialog" aria-modal="true" aria-label="直す"></div>
  </div>

  <div class="overlay" id="import" hidden>
    <div class="sheet" id="import-body" role="dialog" aria-modal="true" aria-label="CSVから読み込む"></div>
  </div>
  <input type="file" id="import-file" accept=".csv,text/csv" hidden>

  <div class="overlay" id="loader" hidden>
    <div class="sheet">
      <h2>台帳を読み込めませんでした</h2>
      <p>ファイルを直接開いた場合、ブラウザの制限で台帳を自動で読めません。<br>
        同じフォルダの <code>customers.csv</code> を選んでください。</p>
      <p>毎回選ぶのが面倒なら、<code>遊ぶ.command</code> をダブルクリックして起動してください。</p>
      <input type="file" id="csv-file" accept=".csv,text/csv">
      <p class="error" id="loader-error"></p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="logic.js?v=16"></script>
  <script src="ui.js?v=18"></script>
</body>
</html>
