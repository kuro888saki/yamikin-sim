<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- URLを知っている人だけが開く想定。検索結果には出さない -->
  <meta name="robots" content="noindex, nofollow">
  <title>小口金融 顧客管理システム</title>
  <!-- タブのアイコン：黒地に金色の明朝「金」 -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=1">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="shop">小口金融</span>
      <h1>顧客管理システム<small id="period-label"></small></h1>
    </div>
    <dl class="kpis" id="kpis"></dl>
    <div class="top-actions">
      <button class="ghost on-dark" data-act="shop-edit" title="手持ち資金・凄み・警察の目を直す">店の数字</button>
      <button class="ghost on-dark" data-act="period-open" title="期間（最終日）と目標の純利を変える">期間・目標</button>
      <button class="ghost on-dark" data-act="reset" title="台帳を読み直して1日目からやり直す">最初から</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="画面の切り替え"></nav>

  <main class="view" id="view"></main>

  <div class="scrim" id="scrim" data-act="close-drawer" hidden></div>
  <aside class="drawer" id="drawer" tabindex="-1" aria-label="詳細" hidden></aside>

  <footer class="bar">
    <span class="hint" id="hint"></span>
    <button class="ghost" id="skip" data-act="skip">早送り ▶▶</button>
    <button class="primary" id="end" data-act="end">1日を終える ▶</button>
  </footer>

  <div class="overlay" id="result" hidden>
    <div class="sheet" id="result-body"></div>
  </div>

  <div class="overlay" id="alloc" hidden>
    <div class="sheet" id="alloc-body" role="dialog" aria-modal="true" aria-label="不明入金を充当する"></div>
  </div>

  <div class="overlay" id="period" hidden>
    <div class="sheet" id="period-body" role="dialog" aria-modal="true" aria-label="期間・目標"></div>
  </div>

  <div class="overlay" id="reset" hidden>
    <div class="sheet" id="reset-body" role="dialog" aria-modal="true" aria-label="最初から"></div>
  </div>

  <div class="overlay" id="editor" hidden>
    <div class="sheet" id="editor-body" role="dialog" aria-modal="true" aria-label="直す"></div>
  </div>

  <div class="overlay" id="import" hidden>
    <div class="sheet" id="import-body" role="dialog" aria-modal="true" aria-label="CSVから読み込む"></div>
  </div>
  <input type="file" id="import-file" accept=".csv,text/csv" hidden>

  <div class="overlay" id="loader" hidden>
    <div class="sheet">
      <h2>台帳を読み込めませんでした</h2>
      <p>ファイルを直接開いた場合、ブラウザの制限で台帳を自動で読めません。<br>
        同じフォルダの <code>customers.csv</code> を選んでください。</p>
      <p>毎回選ぶのが面倒なら、<code>遊ぶ.command</code> をダブルクリックして起動してください。</p>
      <input type="file" id="csv-file" accept=".csv,text/csv">
      <p class="error" id="loader-error"></p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="logic.js?v=17"></script>
  <script src="ui.js?v=19"></script>
</body>
</html>
